[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-constellation"
version = "0.1.0"
description = "See where a paper came from and where it went, drawn as a star chart."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "정범기" }]
keywords = ["research", "citation", "lineage", "arxiv", "semantic-scholar", "pyside6"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Environment :: X11 Applications :: Qt",
]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.gui-scripts]
paper-constellation = "paper_constellation.ui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"paper_constellation.examples" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
