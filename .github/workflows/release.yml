name: Release

# Push a tag such as v0.1.0 to build macOS, Windows and Linux apps and publish them
# as a GitHub Release. "Run workflow" on the Actions tab builds without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install --upgrade pip && pip install ".[dev]" pyinstaller
      - name: Tests
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build
        run: python packaging/build.py
      - name: Smoke test the built app
        run: python packaging/build.py --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
